name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly drift report
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test
      - name: Validate skills + sources
        run: node scripts/validate.mjs
      - name: Retrieval/fact eval
        run: node scripts/eval-retrieval.mjs
      - name: Build is reproducible (no drift between source and adapters)
        run: |
          node scripts/build.mjs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated output differs from source — run 'node scripts/build.mjs' and commit the result."
            git status --porcelain
            exit 1
          fi

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Source drift report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/drift-check.mjs
